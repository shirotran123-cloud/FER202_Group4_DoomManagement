version: '3.8'

services:
  # Frontend Application (Nginx + React SPA)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dms-network

  # Backend Application (Node.js API + Auto Approval Engine + JSON Server)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dms-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./db.json:/app/db.json
    networks:
      - dms-network

networks:
  dms-network:
    driver: bridge

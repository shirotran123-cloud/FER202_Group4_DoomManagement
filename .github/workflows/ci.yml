name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:frontend
      - run: npm run check:parity
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types scripts/verify-dorm-ops.mjs
      - run: npm run check:domain
      - run: npm run db:seed
      - name: Khởi động backend
        run: |
          node server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
      - run: npm run check:contract
      - run: npm run test:api
      - run: npm run test:flows
      - run: npm run build
